version: '3.8'

services:
  agentx-bot:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "11434:11434"
      - "8000:8000"
    volumes:
      - ./models:/models
    environment:
      - OLLAMA_HOST=0.0.0.0:11434
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Optional: Telegram bot service
  telegram-bot:
    build:
      context: ..
      dockerfile: docker/Dockerfile.telegram
    ports:
      - "8080:8080"
    environment:
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - AGENTX_API_URL=http://agentx-bot:8000
    depends_on:
      - agentx-bot
    restart: unless-stopped

networks:
  default:
    name: agentx-network